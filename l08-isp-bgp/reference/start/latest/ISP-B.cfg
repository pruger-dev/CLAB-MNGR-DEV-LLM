username admin privilege 15 role network-admin secret sha512 $6$Ymetvs1LaHs41HH3$.ymX2LoX8I5igam9gWLsMqgO9C1ShjMBuG8d65P9qCq3sGSVQCN8fP047J4TVNpPG4jjAB/U6o0rzbbw1sGeV0
