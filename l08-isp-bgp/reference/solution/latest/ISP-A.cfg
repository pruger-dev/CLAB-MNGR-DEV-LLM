! Command: show running-config
! device: ISP-A (cEOSLab, EOS-4.35.0F-44178984.4350F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$l0AuvyVVkTw6uB7D$MQWI.igepZeHzZ9BbcoFN/0kBo8.hGQj8pswEBfM1mBZVgPutO9OX8sd14fv2Cw13VRmozTc/Oty7O0TH/6W71
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ISP-A
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
interface Ethernet1
   description to R1 (customer AS 65100)
   no switchport
   ip address 172.16.1.0/31
!
interface Ethernet2
   description to ISP-B (peer AS 65002)
   no switchport
   ip address 172.16.0.0/31
!
interface Loopback0
   ip address 10.101.0.1/32
!
interface Loopback1
   description "the Internet" seen from ISP-A: 203.0.113.0/24
   ip address 203.0.113.1/24
!
interface Management0
   ip address 172.20.20.171/24
   ipv6 address 3fff:172:20:20::c/64
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
router bgp 65001
   router-id 10.101.0.1
   neighbor 172.16.0.1 remote-as 65002
   neighbor 172.16.0.1 description ISP-B (AS 65002)
   neighbor 172.16.1.1 remote-as 65100
   neighbor 172.16.1.1 description R1 (AS 65100)
   network 203.0.113.0/24
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
